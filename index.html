  <meta charset="utf-8">

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Slow underwater ripple over the painting -->
      <filter id="ripple" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="2" seed="3" result="w">
          <animate attributeName="baseFrequency" dur="18s" values="0.006 0.012;0.009 0.016;0.006 0.012" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="w" scale="9" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <main>
    <div class="hero">
      <div class="stage">
        <div class="reveal">
          <div class="drift">
            <picture>
              <source srcset="images/whale.webp" type="image/webp">
              <img class="whale" src="images/whale.jpg" alt="Watercolor painting of a whale swimming" width="1600" height="1066">
            </picture>
          </div>
        </div>
      </div>
      <canvas class="droplets" aria-hidden="true"></canvas>
    </div>

    <h1><span class="word">Mohammad</span> <span class="word">Tavassolian</span></h1>
    <p class="role">Senior Backend Engineer · NestJS / Node.js</p>
